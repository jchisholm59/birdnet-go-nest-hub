# BirdNET-Go -> Google Nest Hub (Home Assistant automation)
# Shows each BirdNET-Go detection's photo, name and confidence on a Nest Hub / Google Cast display for 30 s,
# spoken first while input_boolean.bird_announcements_voice is on.
# https://github.com/jchisholm59/birdnet-go-nest-hub - see README.md for setup.
# Before pasting: set the MQTT topic, the hub entity and the TTS entity below.
alias: BirdNET-Go → Nest Hub
description: Show (and optionally speak) BirdNET-Go detections on a Nest Hub / Google Cast display.
mode: queued
max: 3
triggers:
  - trigger: mqtt
    topic: birdnet   # your BirdNET-Go MQTT topic (Settings -> Integrations -> MQTT)
variables:
  bird: "{{ trigger.payload_json }}"
  name: "{{ bird.CommonName }}"
  pct: "{{ (bird.Confidence * 100) | round | int }}"
  hub: media_player.YOUR_NEST_HUB
  last: "{{ states('input_text.birdnet_last_announced').split('|') }}"
conditions:
  # The topic is retained: skip the old message HA gets on restart/reconnect.
  - "{{ as_timestamp(bird.BeginTime, 0) > as_timestamp(now()) - 120 }}"
  # Same species at most once per 15 min (a different species always gets through).
  - "{{ last | count < 2 or last[0] != name or as_timestamp(now()) - (last[1] | float(0)) > 900 }}"
  # Don't talk over music/video someone is casting to the Hub.
  - "{{ not (is_state(hub, 'playing') and state_attr(hub, 'app_name') != 'Default Media Receiver') }}"
actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.birdnet_last_announced
    data:
      value: "{{ name }}|{{ as_timestamp(now()) | int }}"
  # Spoken only while the "Bird announcements voice" switch is on, and only 07:00-21:00;
  # otherwise photo only (photos show around the clock - owls and coyotes come out at night).
  - if:
      - condition: state
        entity_id: input_boolean.bird_announcements_voice
        state: "on"
      - condition: time
        after: "07:00:00"
        before: "21:00:00"
    then:
      - action: tts.speak
        target:
          entity_id: tts.google_en_com
        data:
          media_player_entity_id: "{{ hub }}"
          message: "{{ name }} heard, {{ pct }} percent sure."
      - delay: 6
  - if: "{{ (bird.BirdImage.URL | default('', true)) != '' }}"
    then:
      - action: media_player.play_media
        target:
          entity_id: "{{ hub }}"
        data:
          media_content_id: "{{ bird.BirdImage.URL }}"
          media_content_type: image/jpeg
          extra:
            metadata:
              metadataType: 0
              title: "{{ name }}"
              subtitle: "{{ bird.ScientificName }} · {{ pct }}%"
      - delay: 30
      # Back to the clock/ambient screen, unless someone started something else meanwhile.
      - if: "{{ state_attr(hub, 'media_title') == name and state_attr(hub, 'app_name') == 'Default Media Receiver' }}"
        then:
          - action: media_player.turn_off
            target:
              entity_id: "{{ hub }}"
